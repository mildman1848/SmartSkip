name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    if: ${{ !contains(github.actor, 'dependabot') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: |
            Thanks for opening your first issue in this repository.
          pr_message: |
            Thanks for your first pull request in this repository.
